<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620"><rect width="960" height="620" fill="#F8FAFC"/><text x="40" y="60" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">Moodboard · Portfolio Matias Furtado</text><text x="40" y="92" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Palabras clave: CLARO · CONFIABLE · ACCESIBLE</text><rect x="40" y="120" width="130" height="100" rx="10" fill="#1D4ED8" stroke="#CBD5E1"/><text x="40" y="245" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">#1D4ED8</text><text x="40" y="263" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Primario</text><rect x="190" y="120" width="130" height="100" rx="10" fill="#1E3A8A" stroke="#CBD5E1"/><text x="190" y="245" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">#1E3A8A</text><text x="190" y="263" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Primario oscuro</text><rect x="340" y="120" width="130" height="100" rx="10" fill="#0E7490" stroke="#CBD5E1"/><text x="340" y="245" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">#0E7490</text><text x="340" y="263" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Secundario</text><rect x="490" y="120" width="130" height="100" rx="10" fill="#0F172A" stroke="#CBD5E1"/><text x="490" y="245" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">#0F172A</text><text x="490" y="263" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Tinta</text><rect x="640" y="120" width="130" height="100" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/><text x="640" y="245" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">#F8FAFC</text><text x="640" y="263" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Fondo</text><rect x="790" y="120" width="130" height="100" rx="10" fill="#CBD5E1" stroke="#CBD5E1"/><text x="790" y="245" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">#CBD5E1</text><text x="790" y="263" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Línea</text><text x="40" y="320" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">Tipografía</text><text x="40" y="360" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start">Aa Sans de sistema (títulos y texto)</text><text x="40" y="395" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">Aa Monoespaciada de sistema (etiquetas y tags)</text><text x="40" y="450" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">Estilo de imágenes</text><text x="40" y="480" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Ilustraciones simples, mockups limpios, bordes redondeados (14 px), sombras suaves.</text><text x="40" y="530" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">Justificación</text><text x="40" y="560" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Azul = confianza técnica; fondo claro = legibilidad; sans de sistema = rendimiento y cero carga de fuentes.</text><text x="40" y="590" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#B45309" text-anchor="start">Referencias visuales: completar con capturas de los 3 portfolios del benchmark (pendiente).</text></svg>